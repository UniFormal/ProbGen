<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProbGen — Practice Problems</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #2f80ed 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { font-size: .85rem; opacity: .8; margin-top: 3px; }

    #new-btn {
      padding: 9px 20px;
      background: white;
      color: #2f80ed;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      transition: transform .1s;
    }
    #new-btn:hover { transform: translateY(-1px); }

    main {
      max-width: 960px;
      margin: 28px auto;
      padding: 0 20px 60px;
    }

    .loading { text-align:center; color:#666; padding:60px 0; font-size:1.1rem; }

    /* Problem card */
    .problem-card {
      background: white;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,.1);
    }
    .problem-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8edf5;
    }

    .problem-block { line-height: 1.75; }
    .problem-intro { margin-bottom: 12px; }

    /* Subproblem */
    .subproblem {
      background: #f7f9fc;
      border-left: 4px solid #2f80ed;
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      margin: 12px 0;
    }
    .subproblem-question { line-height: 1.75; margin-bottom: 10px; }

    /* Answer row */
    .answer-row { display:flex; gap:8px; align-items:center; }
    .answer-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #ccd3de;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .answer-row input:focus { border-color: #2f80ed; }
    .answer-row button {
      padding: 8px 18px;
      background: #2f80ed;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .answer-row button:hover    { background: #1c60b3; }
    .answer-row button:disabled { background: #aac4f0; cursor:default; }

    /* Feedback */
    .feedback {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.5;
    }
    .feedback.correct { background:#e8faf0; border:1px solid #52c97a; color:#1a6b38; }
    .feedback.wrong   { background:#fff2f2; border:1px solid #e05c5c; color:#7a1a1a; }
    .feedback.error   { background:#fffbe6; border:1px solid #f0c000; color:#6b5000; }

    /* Tables */
    table { border-collapse:collapse; margin:12px 0; }
    th, td { border:1px solid #bbc3d0; padding:6px 12px; text-align:center; font-size:13px; }
    th { background:#eef0f5; font-weight:600; }

    /* Lists */
    ul, ol { padding-left:22px; margin:6px 0; }
    li { margin:3px 0; line-height:1.75; }

    /* Native MathML */
    math { font-family: "STIX Two Math", "Cambria Math", "Latin Modern Math", serif; }
    math[display="inline"] { display:inline; vertical-align:middle; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>&#127891; ProbGen</h1>
    <p>Practice Problems</p>
  </div>
  <button id="new-btn">&#8635; New Problems</button>
</header>

<main>
  <div id="container"><p class="loading">Loading…</p></div>
</main>

<script>
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.matches('.answer-row input')) {
      e.preventDefault();
      e.target.nextElementSibling.click();
    }
  });
</script>

<script src="target/scala-3.7.4/probgen-fastopt/main.js"></script>

</body>
</html>
