<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProbGen — Practice Problems</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      line-height: 1.7;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #2f80ed 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { font-size: .85rem; opacity: .8; margin-top: 2px; }

    .header-btns { display: flex; gap: 10px; }

    #new-btn, #tex-btn {
      padding: 9px 20px;
      background: white;
      color: #2f80ed;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #new-btn:hover, #tex-btn:hover { background: #e8f0fe; }
    #tex-btn { background: rgba(255,255,255,.16); color: white; }
    #tex-btn:hover { background: rgba(255,255,255,.3); }

    main { max-width: 960px; margin: 28px auto; padding: 0 20px 60px; }

    .loading { text-align: center; color: #666; padding: 60px 0; }

    .problem-card {
      background: white;
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,.1);
    }
    .problem-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8edf5;
    }

    .problem-intro { margin-bottom: 12px; }

    .subproblem {
      background: #f7f9fc;
      border-left: 4px solid #2f80ed;
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      margin: 12px 0;
    }
    .subproblem-question { margin-bottom: 10px; }

    .answer-row { display: flex; gap: 8px; align-items: center; }
    .answer-row input {
      flex: 1; padding: 8px 12px;
      border: 1.5px solid #ccd3de; border-radius: 7px;
      font-size: 14px; outline: none;
    }
    .answer-row input:focus { border-color: #2f80ed; }
    .answer-row button {
      padding: 8px 18px; background: #2f80ed; color: white;
      border: none; border-radius: 7px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    .answer-row button:hover { background: #1c60b3; }

    .feedback {
      display: none; margin-top: 8px; padding: 8px 12px;
      border-radius: 7px; font-size: 13px;
    }
    .feedback.correct { background: #e8faf0; border: 1px solid #52c97a; color: #1a6b38; }
    .feedback.wrong   { background: #fff2f2; border: 1px solid #e05c5c; color: #7a1a1a; }
    .feedback.error   { background: #fffbe6; border: 1px solid #f0c000; color: #6b5000; }
    .feedback.partial { background: #fff8ec; border: 1px solid #e8a33d; color: #7a4a10; }
    .feedback.review  { background: #eef5fd; border: 1px solid #4a90d9; color: #1a3c66; }

    .feedback code {
      background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    /* ── Grading rubric (answer classes) ─────────────────────────── */
    .rubric { margin-top: 8px; }
    .rubric-expected { margin-bottom: 6px; }
    .rubric-list { list-style: none; padding-left: 0; margin: 4px 0; }
    .rubric-list li {
      display: flex; gap: 8px; align-items: baseline;
      padding: 3px 0; border-top: 1px dashed rgba(0,0,0,.12);
    }
    .rubric-pts {
      flex: 0 0 auto; font-weight: 700; font-size: 12px;
      background: rgba(74,144,217,.16); border-radius: 4px; padding: 1px 7px;
    }
    .rubric-note { font-style: italic; opacity: .8; margin-top: 4px; }


    .feedback.flash {
      animation: flash 220ms ease-in-out;
    }

    @keyframes flash {
      0%   { transform: scale(1);   filter: brightness(1); }
      50%  { transform: scale(1.02); filter: brightness(1.02); }
      100% { transform: scale(1);   filter: brightness(1); }
    }

    /* ── Tables ──────────────────────────────────────────────── */
    table { border-collapse: collapse; margin: 12px 0; }
    th, td { border: 1px solid #bbc3d0; padding: 6px 12px; text-align: center; font-size: 13px; }
    th { background: #eef0f5; font-weight: 600; }

    /* ── Lists ───────────────────────────────────────────────── */
    ul, ol { padding-left: 22px; margin: 6px 0; }
    li { margin: 3px 0; }

    /* ── Output panel (used by the .tex export) ─────────────── */
    #output-panel {
      background: white; border-radius: 12px; padding: 20px 24px;
      margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,0,0,.1);
      font-size: 13px;
    }
    .panel-section { margin-bottom: 22px; }
    .panel-section h3 {
      font-size: 1.05rem; margin-bottom: 10px;
      padding-bottom: 8px; border-bottom: 2px solid #e8edf5;
    }
    .panel-box {
      background: #f7f9fc; border-left: 4px solid #2f80ed;
      border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 12px;
    }
    .panel-title { font-weight: 600; margin-bottom: 8px; }
    .panel-note { font-weight: 400; opacity: .65; font-size: 12px; }
    .panel-row { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>&#127891; ProbGen</h1>
    <p>Practice Problems</p>
  </div>
  <div class="header-btns">
    <button id="tex-btn" onclick="exportTeX()">&#128196; Export .tex</button>
    <button id="new-btn">&#8635; New Problems</button>
  </div>
</header>

<main>
  <div id="output-panel" style="display:none"></div>
  <div id="container"><p class="loading">Loading…</p></div>
</main>

<script>
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.matches('.answer-row input')) {
      e.preventDefault();
      e.target.nextElementSibling.click();
    }
  });
</script>
<script src="target/scala-3.7.4/probgen-fastopt/main.js"></script>
</body>
</html>
