name: Deploy ProbGen

on:
  push:
    branches:
      - publicProbGen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Verify sbt version
        run: sbt --version

      - name: Build Scala.js
        run: sbt fastLinkJS

      - name: Copy generated JavaScript
        run: |
          cp target/scala-3.7.4/probgen-fastopt/main.js docs/main.js
          ls -lh docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4